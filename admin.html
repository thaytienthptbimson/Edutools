<!doctype html>
<!--
  Edutools - trang quản trị
  Bản quyền thuộc về Thầy Tiến - GV Trường THPT Bỉm Sơn- Thanh Hóa
-->
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị - Edutools</title>
  <meta name="theme-color" content="#2340a8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✏️%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Mali:wght@600;700&display=swap">
  <script>
    try {
      var t = localStorage.getItem('edutools_theme') ||
        (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body class="admin">

  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <span class="brand-mark" aria-hidden="true">✏️</span>
      <div>
        <h1>Đăng nhập quản trị</h1>
        <p>Dành cho người quản lý Edutools.</p>
      </div>
      <div class="field">
        <label for="pw">Mật khẩu</label>
        <div class="pw-row">
          <input class="input" id="pw" type="password" autocomplete="current-password" required>
          <button type="button" class="btn btn-ghost btn-sm" id="pwToggle" aria-pressed="false">Hiện</button>
        </div>
      </div>
      <p class="form-error" id="loginErr" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Đăng nhập</button>
      <a href="index.html">Về trang chủ</a>
    </form>
  </section>

  <div id="app" hidden>
    <header class="a-top">
      <div class="a-top-l">
        <span class="brand-mark" id="aMark" aria-hidden="true">✏️</span>
        <span class="brand-name" id="aName">Edutools</span>
        <span class="a-badge">Quản trị</span>
      </div>
      <div class="a-top-r">
        <span class="pill ok" id="statePill" role="status"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="previewBtn">Xem thử trang chủ</button>
        <button type="button" class="btn btn-primary btn-sm" id="goPublish">Xuất bản</button>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng hoặc tối" style="width:36px;height:36px">🌙</button>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Đăng xuất</button>
      </div>
    </header>
    <div class="a-body">
      <nav class="a-nav" id="nav" aria-label="Các mục quản trị"></nav>
      <main class="a-main" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="sheet form-dialog" id="dlg"></dialog>
  <dialog class="sheet confirm-dialog" id="dlgConfirm"></dialog>
  <noscript><p style="padding:24px">Trang quản trị cần bật JavaScript.</p></noscript>

  <script src="assets/common.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
